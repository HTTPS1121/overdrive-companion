name: overdrive_companion
description: Overdrive Companion — remote BYD vehicle control for the Overdrive HTTP server.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - fixtures/vehicle_state_sample.json
    - fixtures/auth_status.json
    - fixtures/auth_token_success.json
    - fixtures/command_lock_confirmed.json
    - fixtures/command_lock_unconfirmed.json
