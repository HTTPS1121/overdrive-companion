name: Release companion APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          } >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Read app version
        id: ver
        run: |
          chmod +x tools/print-version.sh
          eval "$(tools/print-version.sh)"
          echo "versionName=$versionName" >> "$GITHUB_OUTPUT"
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 secret is not set" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: 4ac09b7354a71352c9aa706b3992bf977053b43dbcd7352bbf39a86996bd29b8
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          ACTUAL="$(apksigner verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/{print $6; exit}' | tr -d ':')"
          ACTUAL_LC="$(echo "$ACTUAL" | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_LC" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Unexpected signing certificate: $ACTUAL_LC" >&2
            apksigner verify --print-certs "$APK" || true
            exit 1
          fi

      - name: Package release artifact
        id: artifact
        run: |
          VERSION="${{ steps.ver.outputs.versionName }}"
          CODE="${{ steps.ver.outputs.versionCode }}"
          SRC="app/build/outputs/apk/release/app-release.apk"
          OUT="overdrive-companion-v${VERSION}.apk"
          META="companion-release-v${VERSION}-meta.json"
          cp "$SRC" "$OUT"
          SHA256="$(sha256sum "$OUT" | awk '{print $1}')"
          printf '{"versionName":"%s","versionCode":%s,"apkSha256":"%s"}\n' "$VERSION" "$CODE" "$SHA256" > "$META"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "meta=$META" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "## Release v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: $CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release notes
        id: notes
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "Signed companion APK for OverDrive head-unit release bundled in this build."
            echo ""
            echo "- \`versionCode\`: ${{ steps.ver.outputs.versionCode }}"
            echo "- SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`"
            echo ""
            if [ -f app/UPSTREAM_BUNDLE_NOTES.md ]; then
              echo "## Bundled web UI changes"
              echo ""
              cat app/UPSTREAM_BUNDLE_NOTES.md
            fi
          } > "$NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.versionName }}
          name: OverDrive Companion v${{ steps.ver.outputs.versionName }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            ${{ steps.artifact.outputs.apk }}
            ${{ steps.artifact.outputs.meta }}
          fail_on_unmatched_files: true