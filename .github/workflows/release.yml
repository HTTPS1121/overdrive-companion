name: Release companion APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Read app version
        id: ver
        run: |
          chmod +x tools/print-version.sh
          eval "$(tools/print-version.sh)"
          echo "versionName=$versionName" >> "$GITHUB_OUTPUT"
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 secret is not set" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.keystore" >> "$GITHUB_ENV"

      - name: Assemble signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: 4ac09b7354a71352c9aa706b3992bf977053b43dbcd7352bbf39a86996bd29b8
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          ACTUAL="$(apksigner verify --print-certs "$APK" | awk '/Signer #1 certificate SHA-256 digest:/{print $6; exit}' | tr -d ':')"
          ACTUAL_LC="$(echo "$ACTUAL" | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL_LC" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Unexpected signing certificate: $ACTUAL_LC" >&2
            apksigner verify --print-certs "$APK" || true
            exit 1
          fi

      - name: Package release artifact
        id: artifact
        run: |
          VERSION="${{ steps.ver.outputs.versionName }}"
          SRC="app/build/outputs/apk/release/app-release.apk"
          OUT="overdrive-companion-v${VERSION}.apk"
          cp "$SRC" "$OUT"
          SHA256="$(sha256sum "$OUT" | awk '{print $1}')"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "## Release v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- versionCode: ${{ steps.ver.outputs.versionCode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`$SHA256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.versionName }}
          name: OverDrive Companion v${{ steps.ver.outputs.versionName }}
          body: |
            Signed companion APK for OverDrive head-unit release bundled in this build.

            - `versionCode`: ${{ steps.ver.outputs.versionCode }}
            - SHA-256: `${{ steps.artifact.outputs.sha256 }}`
          files: ${{ steps.artifact.outputs.apk }}
          fail_on_unmatched_files: true