name: Update bundled OverDrive web UI

# Manual only — run from Actions when you want to pull a newer upstream release APK.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null
          "$SDKMGR" "build-tools;36.0.0" "platform-tools"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Check for newer upstream release
        id: check
        run: |
          chmod +x tools/check-upstream-release.sh
          set +e
          tools/check-upstream-release.sh > upstream-check.json
          code=$?
          set -e
          cat upstream-check.json
          if [ "$code" -eq 2 ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$code" -eq 0 ]; then
            echo "newer=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Snapshot previous bundle
        if: steps.check.outputs.newer == 'true'
        run: |
          cp app/src/main/assets/WEB_SOURCE.json /tmp/prev-web-source.json
          mkdir -p /tmp/prev-web
          cp -a app/src/main/assets/web/. /tmp/prev-web/

      - name: Refresh web assets
        if: steps.check.outputs.newer == 'true'
        run: |
          chmod +x tools/update-web-assets.sh
          tools/update-web-assets.sh

      - name: Reset shell patch counter
        if: steps.check.outputs.newer == 'true'
        run: echo 0 > app/shell_patch.txt

      - name: Write bundle change summary
        if: steps.check.outputs.newer == 'true'
        run: |
          chmod +x tools/summarize-bundle-update.sh
          tools/summarize-bundle-update.sh /tmp/prev-web-source.json /tmp/prev-web | tee /tmp/commit-msg.txt

      - name: Commit and push
        if: steps.check.outputs.newer == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/web app/src/main/assets/WEB_SOURCE.json app/shell_patch.txt app/UPSTREAM_BUNDLE_NOTES.md
          SUBJECT="$(head -1 /tmp/commit-msg.txt)"
          BODY="$(sed -n '/^---BODY---$/,$p' /tmp/commit-msg.txt | tail -n +2)"
          git commit -m "$SUBJECT" -m "$BODY"
          git push